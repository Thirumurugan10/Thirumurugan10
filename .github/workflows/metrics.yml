name: Metrics

on:
  # Runs automatically every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Runs on every push to the main branch
  push:
    branches:
      - main

  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GitHub Actions built-in token
          token: ${{ secrets.GITHUB_TOKEN }}

          # GitHub username
          user: Thirumurugan10

          # Template
          template: classic

          # Base metrics
          base: header, activity, community, repositories

          # Timezone
          config_timezone: Asia/Kolkata

          # --- Repository / contribution activity ---
          plugin_lines: yes
          plugin_lines_sections: base

          # --- 3D Isometric Contribution Calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Commit Activity ---
          plugin_habits: yes
          plugin_habits_charts_type: bar
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: yes
          plugin_habits_times: yes

          # --- Most Used Languages ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # --- Display ---
          config_display: large
          config_output: svg
